# CAP-05: strict pre-merge / pre-tag verification (mirrors local release discipline).
name: Release candidate gate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMAS_LOCAL_ONLY: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || \
            pip install pytest pytest-asyncio httpx fastapi pydantic pydantic-settings sqlalchemy

      - name: Policy + fixtures
        run: |
          python scripts/check_no_mock_runtime.py
          python scripts/validate_run_event_fixtures.py

      - name: Unit tests (core)
        run: pytest tests/unit/ -q --tb=short -m "not tasks_integrated_db_mock"

      - name: Integration tests (mocked)
        run: pytest tests/integration/test_tasks_integrated_integration.py -q --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build + types + unit + E2E
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm run test:components
          npm run e2e:interactive
          npm run e2e:a11y
