name: Integration tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMAS_LOCAL_ONLY: "1"
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install -r requirements-dev.txt 2>/dev/null || \
            pip install pytest pytest-asyncio httpx fastapi pydantic pydantic-settings sqlalchemy

      - name: Validate RunEvent fixture contract (F8-3)
        run: python scripts/validate_run_event_fixtures.py

      - name: Run mocked integration tests
        run: |
          pytest tests/integration/test_tasks_integrated_integration.py -q --tb=short

  frontend-a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run command-center interactive E2E (CAP-04)
        run: npm run e2e:interactive
        working-directory: frontend

      - name: Run accessibility sweep (command-center routes)
        run: npm run e2e:a11y
        working-directory: frontend
